                </ul>
            </nav>
        </header>

        <section id="meal-section">
            <form id="meal-form">
              <h2>Log Your Meal</h2>

              <div class="form-group">
                <label for="meal-name">Meal Name</label>
                <input type="text" id="meal-name" placeholder="e.g., Breakfast" required>
              </div>
              
              <div class="form-group">
                <label for="meal-date">Date</label>
                <input type="date" id="meal-date" required>
              </div>
              
              <div class="form-group">
                <label for="meal-foods">Foods</label>
                <input type="text" id="meal-foods" placeholder="e.g., Eggs, Toast, Orange Juice" required>
              </div>
          
              <div class="form-group">
                <label for="meal-calories">Calories</label>
                <input type="number" id="meal-calories" placeholder="e.g., 500">
              </div>
          
              <div class="form-group">
                <label for="meal-notes">Notes</label>
                <textarea id="meal-notes" rows="4" placeholder="Any extra notes..."></textarea>
              </div>
          
              <button type="submit" id="meal-submit">Save Meal</button>
            </form>
        </section>
        <div id="meal-history"></div>
        <script src="./js/meal.js"></script>
    </body>
</html>
